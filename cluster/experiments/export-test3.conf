# export-test3 — export the test3 datastores. Consumed by cluster/submit.sh.
WORKLOAD=export

# --- scheduler ---
PARTITION=medium96s
CONSTRAINT=sapphirerapids
NTASKS=1
MEM=64G
TIME=02:00:00
ARRAY=0-2
JOB_NAME=export-test3
OUTPUT=./slurm_test3/export-%A_%a.out
ERROR=./slurm_test3/export-%A_%a.err

# --- runtime ---
CHUNK_START=0
CHUNK_END=1
BATCH_SIZE=1
N_CHUNKS=1
CHUNK_DIR=/data/MOZAIK/mozaik_chunk_test3
OUTPUT_PREFIX=/data/mozaik_data_test3/trial
DATASTORE_PREFIX=1_TEST3_EXPT
