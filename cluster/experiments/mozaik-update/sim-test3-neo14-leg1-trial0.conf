# sim-test3-neo14-leg1-trial0 — Leg-1 (environment-equivalence) trial0 of the mozaik-update campaign.
# Same NEW container + code as the smoke, but 2024 LGN mode via PARAM_FILE=param/defaults_2024
# (original_2024_lgn_mode:True) so it should statistically match the frozen OLD env.
# Submitted as a DETACHED sbatch batch job (NOT a foreground interactive run) — the previous by-hand
# run died when its interactive session ended, not from any 2024-mode bug. Consumed by cluster/submit.sh.
WORKLOAD=sim

# --- scheduler ---
PARTITION=medium96s
CONSTRAINT=sapphirerapids
NTASKS=12
MEM=250G
TIME=02:00:00
ARRAY=0-0
JOB_NAME=mozaik-neo14-leg1-t0
OUTPUT=./slurm_neo14_leg1/mozaik-neo14-leg1-t0-%A_%a.out
ERROR=./slurm_neo14_leg1/mozaik-neo14-leg1-t0-%A_%a.err

# --- runtime ---
N_CHUNKS=1
CHUNK_DIR=/data/MOZAIK/mozaik_chunk_test3
# NEW container; absolute path.
SIF_IMAGE=/mnt/vast-nhr/projects/nix00014/goirik/MOZAIK-new/mozaik-sif/mozaik-opt_2026-07-10.sif
# 2024 LGN mode (original_2024_lgn_mode:True) — this is what makes it Leg-1 rather than the smoke.
PARAM_FILE=param/defaults_2024
