# export-prod — production Experanto export (screen-only, 12 chunks). Consumed by cluster/submit.sh.
WORKLOAD=export

# --- scheduler ---
PARTITION=standard96
CONSTRAINT=cascadelake
NTASKS=1
MEM=150G
TIME=48:00:00
ARRAY=1
JOB_NAME=mozaik-export
OUTPUT=./slurm_export_dynamic26872-17-20/export-%A_%a.out
ERROR=./slurm_export_dynamic26872-17-20/export-%A_%a.err

# --- runtime (TRIAL=array_id) ---
CHUNK_START=0
CHUNK_END=12
BATCH_SIZE=12
EXPORT_MODE=--screen-only
# N_CHUNKS unset -> compose default 12; CHUNK_DIR unset -> /data/mozaik_chunk;
# OUTPUT_PREFIX / DATASTORE_PREFIX unset -> empty
