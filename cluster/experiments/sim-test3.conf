# sim-test3 — 3 trials × 1 chunk (2 images + 1 video). Consumed by cluster/submit.sh.
WORKLOAD=sim

# --- scheduler ---
PARTITION=medium96s
CONSTRAINT=sapphirerapids
NTASKS=12
MEM=250G
TIME=02:00:00
ARRAY=0-2
JOB_NAME=mozaik-test3
OUTPUT=./slurm_test3/mozaik-test3-%A_%a.out
ERROR=./slurm_test3/mozaik-test3-%A_%a.err

# --- runtime ---
N_CHUNKS=1
CHUNK_DIR=/data/MOZAIK/mozaik_chunk_test3
