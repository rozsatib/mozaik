# sim-scale-nt12 — NTASKS scaling sweep, arm ntasks=12. Consumed by cluster/submit.sh.
# Identical workload to sim-test3 (chunk 0_0.json, copied to 12_0.json); only NTASKS varies.
# array index = 12 => TRIAL=12, CHUNK=0 => output SelfSustainedPushPull_trial12_chunk0 (isolated per arm).
WORKLOAD=sim

# --- scheduler ---
PARTITION=medium96s
CONSTRAINT=sapphirerapids
NTASKS=12
MEM=250G
TIME=02:30:00
ARRAY=12
JOB_NAME=mozaik-scale-nt12
OUTPUT=./slurm_scale/mozaik-scale-nt12-%A_%a.out
ERROR=./slurm_scale/mozaik-scale-nt12-%A_%a.err

# --- runtime ---
N_CHUNKS=1
CHUNK_DIR=/data/MOZAIK/mozaik_chunk_scaling
