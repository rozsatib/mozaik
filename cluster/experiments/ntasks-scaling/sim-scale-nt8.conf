# sim-scale-nt8 — NTASKS scaling sweep, arm ntasks=8. Consumed by cluster/submit.sh.
# Identical workload to sim-test3 (chunk 0_0.json, copied to 8_0.json); only NTASKS varies.
# array index = 8 => TRIAL=8, CHUNK=0 => output SelfSustainedPushPull_trial8_chunk0 (isolated per arm).
WORKLOAD=sim

# --- scheduler ---
PARTITION=medium96s
CONSTRAINT=sapphirerapids
NTASKS=8
MEM=250G
TIME=02:30:00
ARRAY=8
JOB_NAME=mozaik-scale-nt8
OUTPUT=./slurm_scale/mozaik-scale-nt8-%A_%a.out
ERROR=./slurm_scale/mozaik-scale-nt8-%A_%a.err

# --- runtime ---
N_CHUNKS=1
CHUNK_DIR=/data/MOZAIK/mozaik_chunk_scaling
