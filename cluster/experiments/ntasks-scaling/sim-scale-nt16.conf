# sim-scale-nt16 — NTASKS scaling sweep, arm ntasks=16. Consumed by cluster/submit.sh.
# Identical workload to sim-test3 (chunk 0_0.json, copied to 16_0.json); only NTASKS varies.
# array index = 16 => TRIAL=16, CHUNK=0 => output SelfSustainedPushPull_trial16_chunk0 (isolated per arm).
WORKLOAD=sim

# --- scheduler ---
PARTITION=medium96s
CONSTRAINT=sapphirerapids
NTASKS=16
MEM=250G
TIME=02:30:00
ARRAY=16
JOB_NAME=mozaik-scale-nt16
OUTPUT=./slurm_scale/mozaik-scale-nt16-%A_%a.out
ERROR=./slurm_scale/mozaik-scale-nt16-%A_%a.err

# --- runtime ---
N_CHUNKS=1
CHUNK_DIR=/data/MOZAIK/mozaik_chunk_scaling
