# sim-scale-nt24 — NTASKS scaling sweep, arm ntasks=24. Consumed by cluster/submit.sh.
# Identical workload to sim-test3 (chunk 0_0.json, copied to 24_0.json); only NTASKS varies.
# array index = 24 => TRIAL=24, CHUNK=0 => output SelfSustainedPushPull_trial24_chunk0 (isolated per arm).
WORKLOAD=sim

# --- scheduler ---
PARTITION=medium96s
CONSTRAINT=sapphirerapids
NTASKS=24
MEM=250G
TIME=02:30:00
ARRAY=24
JOB_NAME=mozaik-scale-nt24
OUTPUT=./slurm_scale/mozaik-scale-nt24-%A_%a.out
ERROR=./slurm_scale/mozaik-scale-nt24-%A_%a.err

# --- runtime ---
N_CHUNKS=1
CHUNK_DIR=/data/MOZAIK/mozaik_chunk_scaling
