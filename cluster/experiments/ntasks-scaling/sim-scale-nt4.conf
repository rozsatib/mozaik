# sim-scale-nt4 — NTASKS scaling sweep, arm ntasks=4. Consumed by cluster/submit.sh.
# Identical workload to sim-test3 (chunk 0_0.json, copied to 4_0.json); only NTASKS varies.
# array index = 4 => TRIAL=4, CHUNK=0 => output SelfSustainedPushPull_trial4_chunk0 (isolated per arm).
WORKLOAD=sim

# --- scheduler ---
PARTITION=medium96s
CONSTRAINT=sapphirerapids
NTASKS=4
MEM=250G
TIME=02:30:00
ARRAY=4
JOB_NAME=mozaik-scale-nt4
OUTPUT=./slurm_scale/mozaik-scale-nt4-%A_%a.out
ERROR=./slurm_scale/mozaik-scale-nt4-%A_%a.err

# --- runtime ---
N_CHUNKS=1
CHUNK_DIR=/data/MOZAIK/mozaik_chunk_scaling
