# export-test33 — export the test33 datastores (array 20-50). Consumed by cluster/submit.sh.
# NOTE: DATASTORE_PREFIX is intentionally unset here (unlike export-test3) — preserved verbatim from
# the old run-export-test33.sbatch. Reconciling this vs export-test3 is a separate follow-up (test33 §6).
WORKLOAD=export

# --- scheduler ---
PARTITION=standard96
CONSTRAINT=cascadelake
NTASKS=1
MEM=64G
TIME=06:00:00
ARRAY=20-50
JOB_NAME=export-test33
OUTPUT=./slurm_test33/export-%A_%a.out
ERROR=./slurm_test33/export-%A_%a.err

# --- runtime ---
CHUNK_START=0
CHUNK_END=1
BATCH_SIZE=1
N_CHUNKS=1
CHUNK_DIR=/data/MOZAIK/mozaik_chunk_test33
OUTPUT_PREFIX=/data/mozaik_data_test33/trial
# DATASTORE_PREFIX unset -> empty (preserved from old launcher)
