# sim-prod — production V1 simulation. Consumed by cluster/submit.sh.
# NOTE: ARRAY=0-23 is preserved verbatim from the old run-array.sbatch (a nominal "20 trials × 12
# chunks" would be 0-239 — flagged as a separate follow-up in test33 §6; NOT changed here).
WORKLOAD=sim

# --- scheduler ---
PARTITION=medium96s
CONSTRAINT=sapphirerapids
NTASKS=12
MEM=250G
TIME=48:00:00
ARRAY=0-23
JOB_NAME=mozaik-simulation
OUTPUT=./slurm_239/mozaik-opt-%j.out
ERROR=./slurm_239/mozaik-opt-%j.err

# --- runtime (TRIAL=array_id/N_CHUNKS, CHUNK=array_id%N_CHUNKS) ---
N_CHUNKS=12
# CHUNK_DIR unset -> compose default /data/mozaik_chunk
