# sim-test33 — 31 trials × 1 chunk (array 20-50). Consumed by cluster/submit.sh.
WORKLOAD=sim

# --- scheduler ---
PARTITION=standard96
CONSTRAINT=cascadelake
NTASKS=12
MEM=150G
TIME=6:00:00
ARRAY=20-50
JOB_NAME=mozaik-test33
OUTPUT=./slurm_test33/mozaik-test33-%A_%a.out
ERROR=./slurm_test33/mozaik-test33-%A_%a.err

# --- runtime ---
N_CHUNKS=1
CHUNK_DIR=/data/MOZAIK/mozaik_chunk_test33
